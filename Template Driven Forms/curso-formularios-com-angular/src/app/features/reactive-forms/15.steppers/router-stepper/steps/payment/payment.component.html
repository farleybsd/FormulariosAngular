<ng-container [formGroup]="form">
  <fieldset class="fieldset">
    <legend class="fieldset-legend">Cartao de Credito</legend>
    <input type="text" class="input w-full" placeholder="Numero Do Cartao" formControlName="creditCard" />
    <app-error-messages [control]="form.controls.creditCard" />
  </fieldset>

  <fieldset class="fieldset">
    <legend class="fieldset-legend">Expiracao</legend>
    <input type="text" class="input w-full" placeholder="MM/AA" formControlName="expiry" />
    <app-error-messages [control]="form.controls.expiry" />
  </fieldset>

  <fieldset class="fieldset">
    <legend class="fieldset-legend">Cvv</legend>
    <input type="text" class="input w-full" placeholder="000" formControlName="cvv" />
    <app-error-messages [control]="form.controls.cvv" />
  </fieldset>


   <div class="flex ">
    <button class="btn btn-primary" routeLink="../address" >Passo Anterior</button>
     <button class="btn btn-primary ml-auto" routeLink="../confirmation" [disabled]="form.invalid">Próximo Passo</button>
  </div>
</ng-container>
